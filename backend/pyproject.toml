[project]
name = "invoice-escalator-backend"
version = "0.1.0"
description = "Automated Invoice & Payment Escalator Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "supabase>=2.3.0",
    "stripe>=8.0.0",
    "resend>=2.0.0",
    "python-dotenv>=1.0.0",
    "apscheduler>=3.10.4",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
