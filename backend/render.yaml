services:
  - type: web
    name: invoice-escalator-backend
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: Automated Invoice & Payment Escalator
      - key: DEBUG
        value: "false"
      - key: PORT
        value: "8000"
      - key: HOST
        value: "0.0.0.0"
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: DEFAULT_SENDER_EMAIL
        value: billing@yourdomain.com
      - key: ESCALATION_CHECK_HOURS
        value: "6"
      - key: ENABLE_SCHEDULER
        value: "true"
